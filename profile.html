<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Profil - share, prepare, compare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-image: url('back.jpeg'); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; min-height: 100vh; display: flex; flex-direction: column; }
        header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; }
        .logo-img { height: 55px; width: auto; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); object-fit: contain; }
        .page-title { font-size: 36px; font-weight: 500; color: #000; }
        
        main { flex: 1; padding: 40px 20px; max-width: 480px; margin: 0 auto; width: 100%; }
        .profile-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px); border-radius: 20px; padding: 35px 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; gap: 15px; }
        
        .avatar-icon { font-size: 90px; color: #64b5f6; margin-bottom: 5px; }
        .user-name { font-size: 28px; font-weight: 700; color: #000; text-align: center; }
        .user-email { font-size: 15px; color: #666; text-align: center; margin-top: -10px; margin-bottom: 15px; }

        .menu-list { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .menu-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background-color: #7cbdff; color: #000; border-radius: 12px; text-decoration: none; font-size: 16px; font-weight: 600; border: none; cursor: pointer; transition: transform 0.2s, background 0.2s; }
        .menu-btn:hover { background-color: #64b5f6; transform: translateY(-2px); }
        .menu-btn i.left-icon { width: 25px; font-size: 18px; }
        .menu-btn div { display: flex; align-items: center; gap: 10px; }

        .auth-action-btn { background-color: #66bb6a; color: #fff; }
        .auth-action-btn:hover { background-color: #4caf50; }
        .logout-btn { background-color: #ef5350; color: #fff; }
        .logout-btn:hover { background-color: #e53935; }
    </style>
</head>
<body>

    <header>
        <a href="index.html">
            <img src="logo.png" alt="Logo" class="logo-img" onerror="this.onerror=null; this.src='logo.jpg';">
        </a>
        <h1 class="page-title">Mein Profil</h1>
        <div style="width: 36px;"></div> <!-- Platzhalter für Symmetrie -->
    </header>

    <main>
        <div class="profile-card">
            <i class="fa-solid fa-circle-user avatar-icon"></i>
            <h2 class="user-name" id="user-display-name">Lade Profil...</h2>
            <p class="user-email" id="user-display-email"></p>

            <div class="menu-list">
                <a href="notes.html" class="menu-btn">
                    <div><i class="fa-solid fa-file-lines left-icon"></i> Meine Notizen</div>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                <a href="groups.html" class="menu-btn">
                    <div><i class="fa-solid fa-user-group left-icon"></i> Meine Gruppen</div>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                <a href="classes.html" class="menu-btn">
                    <div><i class="fa-solid fa-graduation-cap left-icon"></i> Meine Klassen</div>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                
                <!-- Dynamischer Login / Logout Button -->
                <div id="auth-button-container"></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJVCWyKoD97UCNx1Z_vDKKG9aGkCSAY38",
            authDomain: "noatly-144b7.firebaseapp.com",
            projectId: "noatly-144b7",
            storageBucket: "noatly-144b7.firebasestorage.app",
            messagingSenderId: "958712826528",
            appId: "1:958712826528:web:5134bb7688c05bddbb17c5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const nameElement = document.getElementById('user-display-name');
        const emailElement = document.getElementById('user-display-email');
        const btnContainer = document.getElementById('auth-button-container');

        // Prüfen, wer angemeldet ist
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Name aus Firebase Auth oder Firestore holen
                let name = user.displayName;

                if (!name) {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists() && userDoc.data().name) {
                        name = userDoc.data().name;
                    }
                }

                nameElement.innerText = name || "Schüler";
                emailElement.innerText = user.email;

                // Logout Button anzeigen
                btnContainer.innerHTML = `
                    <button class="menu-btn logout-btn" id="logout-btn">
                        <div><i class="fa-solid fa-right-from-bracket left-icon"></i> Abmelden</div>
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                `;

                document.getElementById('logout-btn').addEventListener('click', () => {
                    signOut(auth).then(() => {
                        window.location.reload();
                    });
                });

            } else {
                // Wenn kein Nutzer eingeloggt ist
                nameElement.innerText = "Schüler / Gast";
                emailElement.innerText = "Nicht angemeldet";

                // Login Button anzeigen
                btnContainer.innerHTML = `
                    <a href="login.html" class="menu-btn auth-action-btn">
                        <div><i class="fa-solid fa-right-to-bracket left-icon"></i> Anmelden</div>
                        <i class="fa-solid fa-chevron-right"></i>
                    </a>
                `;
            }
        });
    </script>
</body>
</html>
