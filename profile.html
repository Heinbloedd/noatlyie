<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Profil - share, prepare, compare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-image: url('back.jpeg'); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; min-height: 100vh; display: flex; flex-direction: column; }
        header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; }
        .logo-img { height: 55px; width: auto; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); object-fit: contain; }
        .page-title { font-size: 36px; font-weight: 500; color: #000; }
        
        main { flex: 1; padding: 40px 20px; max-width: 480px; margin: 0 auto; width: 100%; }
        .profile-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px); border-radius: 20px; padding: 35px 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; gap: 15px; }
        
        .avatar-container { position: relative; width: 100px; height: 100px; }
        .avatar-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #64b5f6; }
        .avatar-icon { font-size: 100px; color: #64b5f6; }

        .user-name { font-size: 28px; font-weight: 700; color: #000; text-align: center; }
        .user-email { font-size: 15px; color: #666; text-align: center; margin-top: -10px; margin-bottom: 10px; }

        .menu-list { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .menu-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background-color: #7cbdff; color: #000; border-radius: 12px; text-decoration: none; font-size: 16px; font-weight: 600; border: none; cursor: pointer; transition: transform 0.2s, background 0.2s; }
        .menu-btn:hover { background-color: #64b5f6; transform: translateY(-2px); }
        .menu-btn i.left-icon { width: 25px; font-size: 18px; }
        .menu-btn div { display: flex; align-items: center; gap: 10px; }

        /* Formular für Einstellungen */
        .settings-box { width: 100%; background: rgba(255, 255, 255, 0.9); padding: 15px; border-radius: 12px; display: none; flex-direction: column; gap: 10px; border: 1px solid #ccc; }
        .settings-box input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
        .save-btn { background: #4caf50; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; }

        .auth-action-btn { background-color: #66bb6a; color: #fff; }
        .auth-action-btn:hover { background-color: #4caf50; }
        .logout-btn { background-color: #ef5350; color: #fff; }
        .logout-btn:hover { background-color: #e53935; }
    </style>
</head>
<body>

    <header>
        <a href="index.html">
            <img src="logo.png" alt="Logo" class="logo-img" onerror="this.onerror=null; this.src='logo.jpg';">
        </a>
        <h1 class="page-title">Mein Profil</h1>
        <div style="width: 36px;"></div>
    </header>

    <main>
        <div class="profile-card">
            <div id="avatar-area" class="avatar-container">
                <i class="fa-solid fa-circle-user avatar-icon"></i>
            </div>
            
            <h2 class="user-name" id="user-display-name">Lade Profil...</h2>
            <p class="user-email" id="user-display-email"></p>

            <div class="menu-list">
                <a href="notes.html" class="menu-btn">
                    <div><i class="fa-solid fa-file-lines left-icon"></i> Meine Notizen</div>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                <a href="groups.html" class="menu-btn">
                    <div><i class="fa-solid fa-user-group left-icon"></i> Meine Gruppen</div>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                <a href="classes.html" class="menu-btn">
                    <div><i class="fa-solid fa-graduation-cap left-icon"></i> Meine Klassen</div>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>

                <!-- Einstellungen Button -->
                <button class="menu-btn" id="toggle-settings-btn" style="display: none;">
                    <div><i class="fa-solid fa-gear left-icon"></i> Profil bearbeiten</div>
                    <i class="fa-solid fa-chevron-down"></i>
                </button>

                <!-- Bearbeiten Formular -->
                <div class="settings-box" id="settings-box">
                    <label style="font-size: 12px; font-weight: bold;">Neuer Name:</label>
                    <input type="text" id="edit-name-input" placeholder="Name eingeben">
                    
                    <label style="font-size: 12px; font-weight: bold;">Profilbild (Bild-URL):</label>
                    <input type="url" id="edit-photo-input" placeholder="https://beispiel.de/bild.jpg">
                    
                    <button class="save-btn" id="save-settings-btn">Speichern</button>
                </div>

                <div id="auth-button-container"></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJVCWyKoD97UCNx1Z_vDKKG9aGkCSAY38",
            authDomain: "noatly-144b7.firebaseapp.com",
            projectId: "noatly-144b7",
            storageBucket: "noatly-144b7.firebasestorage.app",
            messagingSenderId: "958712826528",
            appId: "1:958712826528:web:5134bb7688c05bddbb17c5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const nameElement = document.getElementById('user-display-name');
        const emailElement = document.getElementById('user-display-email');
        const avatarArea = document.getElementById('avatar-area');
        const btnContainer = document.getElementById('auth-button-container');
        const toggleBtn = document.getElementById('toggle-settings-btn');
        const settingsBox = document.getElementById('settings-box');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                nameElement.innerText = user.displayName || "Schüler";
                emailElement.innerText = user.email;

                // Profilbild anzeigen falls vorhanden
                if (user.photoURL) {
                    avatarArea.innerHTML = `<img src="${user.photoURL}" class="avatar-img" alt="Profilbild">`;
                } else {
                    avatarArea.innerHTML = `<i class="fa-solid fa-circle-user avatar-icon"></i>`;
                }

                toggleBtn.style.display = 'flex';

                // Settings Ausklappen
                toggleBtn.addEventListener('click', () => {
                    const isVisible = settingsBox.style.display === 'flex';
                    settingsBox.style.display = isVisible ? 'none' : 'flex';
                });

                // Profil Speichern
                document.getElementById('save-settings-btn').addEventListener('click', async () => {
                    const newName = document.getElementById('edit-name-input').value.trim();
                    const newPhoto = document.getElementById('edit-photo-input').value.trim();

                    const updateData = {};
                    if (newName) updateData.displayName = newName;
                    if (newPhoto) updateData.photoURL = newPhoto;

                    try {
                        await updateProfile(user, updateData);
                        alert("Profil aktualisiert!");
                        window.location.reload();
                    } catch (error) {
                        alert("Fehler beim Speichern: " + error.message);
                    }
                });

                btnContainer.innerHTML = `
                    <button class="menu-btn logout-btn" id="logout-btn">
                        <div><i class="fa-solid fa-right-from-bracket left-icon"></i> Abmelden</div>
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                `;

                document.getElementById('logout-btn').addEventListener('click', () => {
                    signOut(auth).then(() => window.location.reload());
                });

            } else {
                nameElement.innerText = "Schüler / Gast";
                emailElement.innerText = "Nicht angemeldet";
                toggleBtn.style.display = 'none';

                btnContainer.innerHTML = `
                    <a href="login.html" class="menu-btn auth-action-btn">
                        <div><i class="fa-solid fa-right-to-bracket left-icon"></i> Anmelden</div>
                        <i class="fa-solid fa-chevron-right"></i>
                    </a>
                `;
            }
        });
    </script>
</body>
</html>
