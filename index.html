<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage - share, prepare, compare</title>
    
    <!-- Font Awesome für die Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Hintergrundbild back.jpeg */
            background-image: url('back.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header Bereich */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        /* Styling für dein Logo (logo.png) */
        .logo-img {
            height: 55px;
            width: auto;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        /* Slogan in der Mitte */
        .tagline {
            font-size: 28px;
            font-weight: 400;
            color: #111;
            letter-spacing: 0.5px;
        }

        /* Profil-Icon oben rechts */
        .profile-btn {
            font-size: 36px;
            color: #000;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .profile-btn:hover {
            transform: scale(1.1);
        }

        /* Hauptinhalt & Buttons Zentrierung */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 320px;
        }

        /* Blaue Haupt-Buttons */
        .btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            padding: 14px 24px;
            background-color: #64b5f6;
            color: #000;
            text-decoration: none;
            border-radius: 35px;
            font-weight: 600;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        /* Hover-Animation */
        .btn:hover {
            background-color: #42a5f5;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: translateY(0);
        }

        .icon-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .btn-upload .icon-circle {
            font-size: 24px;
        }

        .btn-outlined .icon-circle {
            border: 2px solid #000;
        }
    </style>
</head>
<body>

    <!-- Header mit logo.png -->
    <header>
        <div class="logo-container">
            <a href="index.html">
                <img src="logo.png" alt="Logo" class="logo-img">
            </a>
        </div>

        <h1 class="tagline">share, prepare, compare</h1>

        <a href="profile.html" class="profile-btn" title="Mein Profil">
            <i class="fa-regular fa-circle-user"></i>
        </a>
    </header>

    <!-- Hauptbereich -->
    <main>
        <div class="button-container">
            
            <a href="upload.html" class="btn btn-upload">
                <div class="icon-circle">
                    <i class="fa-solid fa-arrow-up-from-bracket"></i>
                </div>
                <span>Hochladen</span>
            </a>

            <a href="my_notes.html" class="btn btn-outlined">
                <div class="icon-circle">
                    <i class="fa-solid fa-file-pen"></i>
                </div>
                <span>meine Notizen</span>
            </a>

            <a href="my_groups.html" class="btn btn-outlined">
                <div class="icon-circle">
                    <i class="fa-solid fa-users"></i>
                </div>
                <span>meine Gruppen</span>
            </a>

        </div>
    </main>

</body>
</html>
